<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Emisión Cristiana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(180deg, #0104a0 0%, #0104a0 85%, #15306b 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 15px;
            margin-top: -110px;
        }

        .logo {
            width: 240px;
            height: 240px;
            border-radius: 12px;
            background: linear-gradient(145deg, #3a2e7c, #2a1f5f);
            border: 4px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .logo::before {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            top: -7px;
            left: -7px;
        }

        .logo-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            transition: all 0.5s ease;
        }

        .logo-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 1;
        }

        .logo-image.show {
            opacity: 1;
        }

        .logo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 1.5;
        }

        .logo-image.show + .logo-overlay {
            opacity: 1;
        }

        .logo-text {
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .logo-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
            opacity: 0.9;
            font-weight: 300;
        }

        .current-song {
            text-align: center;
            margin-bottom: 15px;
            margin-top: -15px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .song-title {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .song-artist {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
            transition: all 0.3s ease;
        }



        .controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .volume-bar-container {
            position: absolute;
            bottom: 165px;
            left: 0;
            right: 0;
            width: 100%;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            z-index: 25;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .volume-slider-container {
            flex: 1;
            position: relative;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            overflow: hidden;
        }

        .volume-fill {
            height: 100%;
            background: #4A90E2;
            border-radius: 4px;
            width: 70%;
            transition: width 0.1s ease;
            position: relative;
        }

        .volume-thumb {
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: white;
            border: 2px solid #4A90E2;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .volume-thumb:hover {
            transform: translateY(-50%) scale(1.2);
            box-shadow: 0 3px 10px rgba(74, 144, 226, 0.5);
        }

        .volume-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
            -webkit-appearance: none;
            appearance: none;
        }

        .volume-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .volume-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }



        .volume-display {
            font-size: 12px;
            font-weight: bold;
        }

        .play-button {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 0;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 15px 35px rgba(102, 126, 234, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .play-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 55%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            border-left: 45px solid white;
            border-top: 28px solid transparent;
            border-bottom: 28px solid transparent;
            transition: all 0.3s ease;
        }

        .play-button.pause::before {
            border: none;
            width: 12px;
            height: 50px;
            background: white;
            left: 40%;
            box-shadow: 22px 0 0 white;
        }

        .play-button::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .play-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 20px 45px rgba(102, 126, 234, 0.6),
                0 10px 25px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .play-button:hover::after {
            opacity: 1;
        }

        .play-button:active {
            transform: translateY(-1px) scale(1.02);
            transition: all 0.1s ease;
        }

        .status {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 10px;
        }

        .live-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 50;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .live-text {
            color: white;
            transition: all 0.3s ease;
        }

        /* Estado: No reproduciendo (Verde) */
        .live-indicator.offline .live-dot {
            background-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .live-indicator.offline .live-text {
            color: #4CAF50;
        }

        /* Estado: Reproduciendo (Rojo con parpadeo) */
        .live-indicator.live .live-dot {
            background-color: #F44336;
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.7);
            animation: softBlink 2s infinite ease-in-out;
        }

        .live-indicator.live .live-text {
            color: #F44336;
        }

        @keyframes softBlink {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.9);
            }
        }

        .loading {
            animation: pulse 1s infinite;
        }

        .connected {
            color: #4CAF50;
        }

        .reconnecting {
            color: #FFC107;
        }

        .error {
            color: #F44336;
        }





        @media (max-width: 768px) {
            .logo {
                width: 200px; /* Aumentar de 100px a 200px para móviles */
                height: 200px;
                border-radius: 12px;
            }
            
            .tagline {
                font-size: 16px;
                padding: 0 20px;
            }

            .current-song {
                margin-bottom: 20px;
                padding: 0 20px;
            }

            .song-title {
                font-size: 14px;
            }

            .song-artist {
                font-size: 12px;
            }


            
            .volume-bar-container {
                bottom: 200px; /* Mover más arriba: de 110px a 200px */
                padding: 0 15px;
            }

            .volume-slider-container {
                flex: 1;
                height: 6px;
            }

            .volume-thumb {
                width: 14px;
                height: 14px;
                right: -7px;
            }
            
            .controls {
                padding: 0;
            }
            
            .live-indicator {
                top: 15px;
                right: 15px;
                padding: 6px 12px;
                font-size: 10px;
            }
            
            .live-dot {
                width: 6px;
                height: 6px;
            }
        }

        /* Botón flotante de WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            animation: whatsappPulse 2s infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(37, 211, 102, 0.6);
            background: linear-gradient(135deg, #128C7E 0%, #25D366 100%);
        }

        .whatsapp-float:active {
            transform: scale(0.95);
        }

        .whatsapp-float::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 50%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .whatsapp-float:hover::after {
            opacity: 0.3;
        }

        @keyframes whatsappPulse {
            0% {
                box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            }
            50% {
                box-shadow: 0 4px 20px rgba(37, 211, 102, 0.8);
            }
            100% {
                box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            }
        }

        /* Ajustes para dispositivos móviles */
        @media (max-width: 768px) {
            .whatsapp-float {
                width: 55px;
                height: 55px;
                bottom: 15px;
                right: 15px;
            }
            
            .whatsapp-float svg {
                width: 28px;
                height: 28px;
            }
        }

        /* Ocultar en pantallas muy pequeñas para evitar superposiciones */
        @media (max-width: 480px) {
            .whatsapp-float {
                width: 50px;
                height: 50px;
                bottom: 12px;
                right: 12px;
            }
            
            .whatsapp-float svg {
                width: 25px;
                height: 25px;
            }
        }

        /* Botón flotante de descarga */
        .download-float {
            position: fixed;
            bottom: 20px;
            right: 90px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FF6B6B 0%, #C73E1D 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            animation: downloadPulse 2s infinite;
        }

        .download-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.6);
            background: linear-gradient(135deg, #C73E1D 0%, #FF6B6B 100%);
        }

        .download-float:active {
            transform: scale(0.95);
        }

        .download-float::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #FF6B6B, #C73E1D);
            border-radius: 50%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .download-float:hover::after {
            opacity: 0.3;
        }

        @keyframes downloadPulse {
            0% {
                box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
            }
            50% {
                box-shadow: 0 4px 20px rgba(255, 107, 107, 0.8);
            }
            100% {
                box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
            }
        }

        /* Ajustes para dispositivos móviles - Ambos botones */
        @media (max-width: 768px) {
            .whatsapp-float {
                width: 55px;
                height: 55px;
                bottom: 15px;
                right: 15px;
            }
            
            .download-float {
                width: 55px;
                height: 55px;
                bottom: 15px;
                right: 80px;
            }
            
            .whatsapp-float svg,
            .download-float svg {
                width: 28px;
                height: 28px;
            }
        }

        /* Ajustes para pantallas muy pequeñas */
        @media (max-width: 480px) {
            .whatsapp-float {
                width: 50px;
                height: 50px;
                bottom: 12px;
                right: 12px;
            }
            
            .download-float {
                width: 50px;
                height: 50px;
                bottom: 12px;
                right: 72px;
            }
            
            .whatsapp-float svg,
            .download-float svg {
                width: 25px;
                height: 25px;
            }
        }

        /* Mensaje flotante para descarga */
        .download-message {
            position: fixed;
            bottom: 90px;
            right: 170px;
            background: linear-gradient(135deg, #FF6B6B 0%, #C73E1D 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 25px;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
            z-index: 999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            max-width: 280px;
            min-width: 200px;
        }

        .download-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .download-message.hide {
            opacity: 0;
            transform: translateY(20px);
        }

        .message-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .message-text {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            flex: 1;
        }

        .message-close {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
            flex-shrink: 0;
        }

        .message-close:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Ajustes para tablets */
        @media (max-width: 768px) {
            .download-message {
                bottom: 80px;
                right: 155px;
                max-width: 250px;
                min-width: 180px;
                padding: 10px 14px;
            }

            .message-text {
                font-size: 13px;
            }
        }

        /* Ajustes para móviles pequeños */
        @media (max-width: 480px) {
            .download-message {
                bottom: 72px;
                right: 140px;
                max-width: 220px;
                min-width: 160px;
                padding: 8px 12px;
            }

            .message-text {
                font-size: 12px;
            }

            .message-close {
                width: 18px;
                height: 18px;
                font-size: 16px;
            }
        }

        /* Botones flotantes de redes sociales */
        .social-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: row;
            gap: 12px;
            z-index: 1000;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .social-btn:active {
            transform: scale(0.95);
        }

        /* Gmail Button */
        .gmail-btn {
            background: linear-gradient(135deg, #EA4335 0%, #FBBC04 100%);
        }

        .gmail-btn:hover {
            background: linear-gradient(135deg, #FBBC04 0%, #EA4335 100%);
        }

        /* Facebook Button */
        .facebook-btn {
            background: linear-gradient(135deg, #1877F2 0%, #42A5F5 100%);
        }

        .facebook-btn:hover {
            background: linear-gradient(135deg, #42A5F5 0%, #1877F2 100%);
        }

        /* YouTube Button */
        .youtube-btn {
            background: linear-gradient(135deg, #FF0000 0%, #FF4444 100%);
        }

        .youtube-btn:hover {
            background: linear-gradient(135deg, #FF4444 0%, #FF0000 100%);
        }

        /* Botón de Compartir */
        .share-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%);
            border: none;
            cursor: pointer;
        }

        .share-btn:hover {
            background: linear-gradient(135deg, #66BB6A 0%, #4CAF50 100%);
        }

        /* Menú de compartir */
        .share-menu {
            position: absolute;
            bottom: 60px;
            left: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
            min-width: 160px;
            z-index: 1001;
        }

        .share-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .share-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            border-bottom: 1px solid #f0f0f0;
        }

        .share-menu-item:last-child {
            border-bottom: none;
        }

        .share-menu-item:hover {
            background-color: #f5f5f5;
        }

        .share-menu-item span {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        /* Colores específicos para cada plataforma en el menú */
        .share-menu-item[data-platform="whatsapp"] span {
            color: #25D366;
        }

        .share-menu-item[data-platform="facebook"] span {
            color: #1877F2;
        }

        .share-menu-item[data-platform="instagram"] span {
            color: #E4405F;
        }

        .share-menu-item[data-platform="twitter"] span {
            color: #1DA1F2;
        }

        /* PayPal Button */
        .paypal-btn {
            background: linear-gradient(135deg, #003087 0%, #0070BA 100%);
        }

        .paypal-btn:hover {
            background: linear-gradient(135deg, #0070BA 0%, #003087 100%);
        }

        /* Iconos */
        .social-btn svg {
            width: 24px;
            height: 24px;
            transition: transform 0.3s ease;
        }

        .social-btn:hover svg {
            transform: scale(1.1);
        }

        /* Ajustes para tablets */
        @media (max-width: 768px) {
            .social-float {
                bottom: 15px;
                left: 15px;
                gap: 10px;
            }

            .social-btn {
                width: 45px;
                height: 45px;
            }

            .social-btn svg {
                width: 22px;
                height: 22px;
            }

            .share-menu {
                bottom: 55px;
                min-width: 140px;
            }

            .share-menu-item {
                padding: 10px 14px;
                gap: 10px;
            }

            .share-menu-item span {
                font-size: 13px;
            }
        }

        /* Ajustes para móviles pequeños */
        @media (max-width: 480px) {
            .social-float {
                bottom: 12px;
                left: 12px;
                gap: 8px;
            }

            .social-btn {
                width: 40px;
                height: 40px;
            }

            .social-btn svg {
                width: 20px;
                height: 20px;
            }

            .share-menu {
                bottom: 50px;
                min-width: 130px;
            }

            .share-menu-item {
                padding: 8px 12px;
                gap: 8px;
            }

            .share-menu-item span {
                font-size: 12px;

        }

        /* Animación de nieve cayendo */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            color: white;
            font-size: 16px;
            animation: fall linear infinite;
            user-select: none;
            text-shadow: 0 0 20px rgba(255, 255, 255, 1);
            opacity: 0.8;
        }

        /* Diferentes tamaños y velocidades para cada copo */
        .snowflake:nth-child(1) { left: 10%; animation-duration: 8s; animation-delay: 0s; font-size: 14px; }
        .snowflake:nth-child(2) { left: 20%; animation-duration: 6s; animation-delay: 1s; font-size: 18px; }

        .snowflake:nth-child(7) { left: 70%; animation-duration: 11s; animation-delay: 2.5s; font-size: 13px; }
        .snowflake:nth-child(8) { left: 80%; animation-duration: 6.5s; animation-delay: 0.2s; font-size: 17px; }
        .snowflake:nth-child(9) { left: 90%; animation-duration: 8.5s; animation-delay: 3.2s; font-size: 14px; }
        .snowflake:nth-child(10) { left: 15%; animation-duration: 7.2s; animation-delay: 1.8s; font-size: 21px; }
        .snowflake:nth-child(11) { left: 25%; animation-duration: 9.5s; animation-delay: 0.8s; font-size: 12px; }
        .snowflake:nth-child(12) { left: 35%; animation-duration: 6.8s; animation-delay: 2.2s; font-size: 16px; }
        .snowflake:nth-child(13) { left: 45%; animation-duration: 8.2s; animation-delay: 1.2s; font-size: 18px; }
        .snowflake:nth-child(14) { left: 55%; animation-duration: 10.5s; animation-delay: 3.5s; font-size: 13px; }
        .snowflake:nth-child(15) { left: 65%; animation-duration: 7.8s; animation-delay: 0.4s; font-size: 15px; }
        .snowflake:nth-child(16) { left: 75%; animation-duration: 9.2s; animation-delay: 1.9s; font-size: 17px; }
        .snowflake:nth-child(17) { left: 85%; animation-duration: 6.3s; animation-delay: 2.7s; font-size: 14px; }
        .snowflake:nth-child(18) { left: 95%; animation-duration: 11.2s; animation-delay: 0.9s; font-size: 20px; }
        .snowflake:nth-child(19) { left: 5%; animation-duration: 8.7s; animation-delay: 3.1s; font-size: 16px; }
        .snowflake:nth-child(20) { left: 75%; animation-duration: 7.5s; animation-delay: 2.8s; font-size: 15px; }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0.8;
            }
        }

        /* Ajustes para dispositivos móviles */
        @media (max-width: 768px) {
            .snowflake {
                font-size: 12px;
            }

    <audio id="audioPlayer" preload="none"></audio>

    <script>
        class RadioPlayer {
            constructor() {
                this.audioPlayer = document.getElementById('audioPlayer');
                this.playButton = document.getElementById('playButton');
                this.volumeSlider = document.getElementById('volumeSlider');
                this.volumeBtn = document.getElementById('volumeBtn');
                this.volumeDisplay = document.getElementById('volumeDisplay');
                this.volumeFill = document.getElementById('volumeFill');
                this.volumeThumb = document.getElementById('volumeThumb');
                this.volumeContainer = document.getElementById('volumeContainer');
                this.status = document.getElementById('status');
                this.albumArt = document.getElementById('albumArt');
                this.logoContent = document.getElementById('logoContent');
                this.songTitle = document.getElementById('songTitle');
                this.songArtist = document.getElementById('songArtist');
                this.liveIndicator = document.getElementById('liveIndicator');
                
                this.streamUrl = 'https://stream.zeno.fm/yg7bvksbfwzuv';
                this.metadataUrl = 'https://api.zeno.fm/mounts/metadata/subscribe/yg7bvksbfwzuv';
                
                this.isPlaying = false;
                this.isMuted = false;
                this.previousVolume = 0.7;
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 10;
                this.reconnectDelay = 2000;
                this.networkStabilizer = null;
                this.eventSource = null;
                
                // Sistema de portadas rotativas (URLs)
                this.defaultCovers = [
                    'https://i.postimg.cc/KvWNYBYk/portada_1.png',
                    'https://i.postimg.cc/ncWkLBL9/portada_2.png', 
                    'https://i.postimg.cc/28tw5h51/portada_3.png',
                    'https://i.postimg.cc/bN5TvkvG/portada_4.png'
                ];
                this.currentCoverIndex = 0;
                this.coverRotationTimer = null;
                this.isShowingSongArt = false;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupNetworkStabilizer();
                this.setupMetadata();
                this.setVolume(70);
                this.setLiveIndicator(false); // Inicializar EN VIVO en verde (offline)
                
                // Iniciar sistema de rotación de portadas
                this.startCoverRotation();
                
                // Autoplay después de una pequeña demora
                setTimeout(() => {
                    this.play();
                }, 1000);
            }

            // Sistema de rotación de portadas
            startCoverRotation() {
                // Mostrar primera portada inmediatamente
                this.showCurrentDefaultCover();
                
                // Modo de testing rápido (descomenta la línea siguiente para rotación cada 30 segundos)
                // const rotationInterval = 30000; // 30 segundos para testing
                const rotationInterval = 600000; // 10 minutos en producción
                
                // Configurar rotación 
                this.coverRotationTimer = setInterval(() => {
                    if (!this.isShowingSongArt) {
                        this.rotateToNextCover();
                    }
                }, rotationInterval);
                
                console.log(`🔄 Sistema de rotación de portadas iniciado (cada ${rotationInterval/1000} segundos)`);
            }

            rotateToNextCover() {
                this.currentCoverIndex = (this.currentCoverIndex + 1) % this.defaultCovers.length;
                const currentTime = new Date().toLocaleTimeString();
                console.log(`🔄 [${currentTime}] Rotando a portada ${this.currentCoverIndex + 1}/${this.defaultCovers.length}:`, this.defaultCovers[this.currentCoverIndex]);
                this.showCurrentDefaultCover();
            }

            showCurrentDefaultCover() {
                const coverPath = this.defaultCovers[this.currentCoverIndex];
                console.log('🎨 Mostrando portada por defecto:', coverPath);
                
                // Crear imagen de prueba
                const testImg = new Image();
                testImg.onload = () => {
                    this.albumArt.src = coverPath;
                    this.albumArt.classList.add('show');
                    this.logoContent.style.opacity = '0';
                    this.isShowingSongArt = false;
                };
                
                testImg.onerror = () => {
                    console.log('❌ Error al cargar portada:', coverPath);
                    this.logoContent.style.opacity = '1';
                    this.albumArt.classList.remove('show');
                };
                
                testImg.src = coverPath;
            }

            setupEventListeners() {
                this.playButton.addEventListener('click', () => {
                    this.isPlaying ? this.pause() : this.play();
                });

                this.volumeSlider.addEventListener('input', (e) => {
                    this.setVolume(e.target.value);
                });

                this.volumeBtn.addEventListener('click', () => {
                    this.toggleMute();
                });

                this.audioPlayer.addEventListener('loadstart', () => {
                    this.updateStatus('loading', '🟡 Conectando...');
                });

                this.audioPlayer.addEventListener('canplay', () => {
                    this.updateStatus('connected', '🟢 Conectado');
                    this.reconnectAttempts = 0;
                });

                this.audioPlayer.addEventListener('playing', () => {
                    this.updateStatus('connected', '🟢 Reproduciendo');
                });

                this.audioPlayer.addEventListener('pause', () => {
                    this.updateStatus('connected', '⏸️ Pausado');
                });

                this.audioPlayer.addEventListener('error', (e) => {
                    console.error('Error de audio:', e);
                    this.handleConnectionError();
                });

                this.audioPlayer.addEventListener('stalled', () => {
                    this.handleConnectionError();
                });

                this.audioPlayer.addEventListener('waiting', () => {
                    this.updateStatus('reconnecting', '🟡 Buffering...');
                });

                // Detectar cambios en la conectividad
                window.addEventListener('online', () => {
                    if (this.isPlaying) {
                        this.reconnect();
                    }
                });

                window.addEventListener('offline', () => {
                    this.updateStatus('error', '🔴 Sin conexión');
                });
            }

            setupNetworkStabilizer() {
                // Monitorea la calidad de la conexión y ajusta el buffer
                this.networkStabilizer = setInterval(() => {
                    if (this.isPlaying && this.audioPlayer.readyState < 3) {
                        // Si el buffer es bajo, intentar optimizar
                        this.optimizeConnection();
                    }
                }, 5000);
            }

            optimizeConnection() {
                // Para conexiones débiles, reducir la frecuencia de reconexión
                if (navigator.connection) {
                    const connection = navigator.connection;
                    if (connection.effectiveType === 'slow-2g' || connection.effectiveType === '2g') {
                        this.reconnectDelay = 5000; // Aumentar el delay para conexiones lentas
                    } else {
                        this.reconnectDelay = 2000; // Delay normal
                    }
                }
            }

            setupMetadata() {
                this.connectToMetadata();
            }

            connectToMetadata() {
                try {
                    if (this.eventSource) {
                        this.eventSource.close();
                    }

                    this.eventSource = new EventSource(this.metadataUrl);
                    
                    this.eventSource.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            this.updateMetadata(data);
                        } catch (e) {
                            console.error('Error parsing metadata:', e);
                        }
                    };

                    this.eventSource.onerror = (error) => {
                        console.error('Metadata connection error:', error);
                        // Reconectar metadata después de un delay
                        setTimeout(() => {
                            this.connectToMetadata();
                        }, 10000);
                    };

                } catch (error) {
                    console.error('Error connecting to metadata:', error);
                    this.songTitle.textContent = '♪ Radio Emisión Cristiana';
                    this.songArtist.textContent = '';
                    this.showDefaultLogo();
                }
            }

            updateMetadata(data) {
                console.log('=== METADATOS COMPLETOS RECIBIDOS ===');
                console.log(JSON.stringify(data, null, 2));

                // Obtener título y artista primero
                let title = '';
                let artist = '';

                // Buscar título en múltiples campos
                if (data.track && data.track.title) {
                    title = data.track.title;
                    artist = data.track.artist || '';
                } else if (data.title) {
                    title = data.title;
                    artist = data.artist || '';
                } else if (data.streamTitle) {
                    title = data.streamTitle;
                } else if (data.current_track) {
                    title = data.current_track.title || data.current_track;
                    artist = data.current_track.artist || '';
                } else if (data.metadata && data.metadata.title) {
                    title = data.metadata.title;
                    artist = data.metadata.artist || '';
                } else if (data.nowPlaying) {
                    title = data.nowPlaying.title || data.nowPlaying;
                    artist = data.nowPlaying.artist || '';
                }

                console.log('🎵 Título encontrado:', title);
                console.log('👤 Artista encontrado:', artist);

                // Actualizar título central (debajo del tagline)
                if (title) {
                    this.songTitle.textContent = `♪ ${title}`;
                    this.songArtist.textContent = artist;
                } else {
                    this.songTitle.textContent = '♪ Radio Emisión Cristiana';
                    this.songArtist.textContent = '';
                }

                // Buscar imagen de manera más exhaustiva
                this.searchImageInMetadata(data, title, artist);
            }

            searchImageInMetadata(data, title, artist) {
                console.log('🔍 Iniciando búsqueda exhaustiva de imagen...');
                
                // Lista extendida de campos posibles para imagen
                const imageFields = [
                    'artwork_url', 'image_url', 'album_art', 'cover_art', 'cover_url',
                    'thumbnail', 'picture', 'image', 'artwork', 'art', 'cover',
                    'album_artwork', 'song_image', 'track_image', 'poster',
                    'albumArt', 'coverArt', 'artworkUrl', 'imageUrl', 'pictureUrl'
                ];

                let imageUrl = null;

                // Función para verificar si una URL es válida
                const isValidImageUrl = (url) => {
                    if (!url || typeof url !== 'string') return false;
                    return url.startsWith('http') && (
                        url.includes('.jpg') || url.includes('.jpeg') || 
                        url.includes('.png') || url.includes('.webp') || 
                        url.includes('.gif') || url.includes('image')
                    );
                };

                // 1. Buscar en el objeto principal
                console.log('🔍 Buscando en objeto principal...');
                for (let field of imageFields) {
                    if (data[field] && isValidImageUrl(data[field])) {
                        imageUrl = data[field];
                        console.log(`✅ Imagen encontrada en "${field}":`, imageUrl);
                        break;
                    }
                }

                // 2. Buscar en el objeto track si existe
                if (!imageUrl && data.track) {
                    console.log('🔍 Buscando en data.track...');
                    for (let field of imageFields) {
                        if (data.track[field] && isValidImageUrl(data.track[field])) {
                            imageUrl = data.track[field];
                            console.log(`✅ Imagen encontrada en track.${field}:`, imageUrl);
                            break;
                        }
                    }
                    
                    // Buscar en album dentro de track
                    if (!imageUrl && data.track.album) {
                        console.log('🔍 Buscando en data.track.album...');
                        for (let field of imageFields) {
                            if (data.track.album[field] && isValidImageUrl(data.track.album[field])) {
                                imageUrl = data.track.album[field];
                                console.log(`✅ Imagen encontrada en track.album.${field}:`, imageUrl);
                                break;
                            }
                        }
                    }
                }

                // 3. Buscar en metadata si existe
                if (!imageUrl && data.metadata) {
                    console.log('🔍 Buscando en data.metadata...');
                    for (let field of imageFields) {
                        if (data.metadata[field] && isValidImageUrl(data.metadata[field])) {
                            imageUrl = data.metadata[field];
                            console.log(`✅ Imagen encontrada en metadata.${field}:`, imageUrl);
                            break;
                        }
                    }
                }

                // 4. Buscar en nowPlaying si existe
                if (!imageUrl && data.nowPlaying) {
                    console.log('🔍 Buscando en data.nowPlaying...');
                    for (let field of imageFields) {
                        if (data.nowPlaying[field] && isValidImageUrl(data.nowPlaying[field])) {
                            imageUrl = data.nowPlaying[field];
                            console.log(`✅ Imagen encontrada en nowPlaying.${field}:`, imageUrl);
                            break;
                        }
                    }
                }

                if (imageUrl) {
                    console.log('🖼️ Intentando cargar imagen desde Zeno.fm:', imageUrl);
                    this.updateAlbumArt(imageUrl);
                } else {
                    console.log('❌ No se encontró imagen en metadatos de Zeno.fm');
                    // Intentar obtener imagen desde Last.fm como alternativa
                    if (title && title.length > 2) {
                        console.log('🔄 Intentando fallback a Last.fm...');
                        this.searchAlbumArt(artist || 'Unknown Artist', title);
                    } else {
                        console.log('❌ Título insuficiente para búsqueda en Last.fm');
                        this.showDefaultLogo();
                    }
                }
            }

            // Función para buscar imagen en Last.fm como alternativa
            async searchAlbumArt(artist, track) {
                try {
                    const lastFmApiKey = '8d3e7e78969a1e10d70f95d14d2a36b2'; // API Key pública de Last.fm
                    const url = `https://ws.audioscrobbler.com/2.0/?method=track.getInfo&api_key=${lastFmApiKey}&artist=${encodeURIComponent(artist)}&track=${encodeURIComponent(track)}&format=json`;
                    
                    console.log('🎵 Buscando en Last.fm:', artist, '-', track);
                    console.log('🔗 URL:', url);
                    
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data.track && data.track.album && data.track.album.image) {
                        const images = data.track.album.image;
                        // Buscar la imagen más grande disponible
                        const largeImage = images.find(img => img.size === 'extralarge') || 
                                         images.find(img => img.size === 'large') || 
                                         images.find(img => img.size === 'medium');
                        
                        if (largeImage && largeImage['#text']) {
                            console.log('✅ Imagen encontrada en Last.fm:', largeImage['#text']);
                            this.updateAlbumArt(largeImage['#text']);
                            return;
                        }
                    }
                    
                    console.log('❌ No se encontró imagen en Last.fm');
                    this.showDefaultLogo();
                } catch (error) {
                    console.error('❌ Error buscando en Last.fm:', error);
                    console.log('🔄 Intentando búsqueda por artista como último recurso...');
                    
                    try {
                        await this.searchArtistImage(artist);
                    } catch (artistError) {
                        console.error('❌ Error en búsqueda de artista:', artistError);
                        this.showDefaultLogo();
                    }
                }
            }

            // Función adicional para buscar imagen del artista
            async searchArtistImage(artist) {
                try {
                    const cleanArtist = artist.replace(/[^\w\s]/gi, '').trim();
                    const lastFmApiKey = '8d3e7e78969a1e10d70f95d14d2a36b2';
                    const url = `https://ws.audioscrobbler.com/2.0/?method=artist.getInfo&api_key=${lastFmApiKey}&artist=${encodeURIComponent(cleanArtist)}&format=json`;
                    
                    console.log('👤 Buscando artista en Last.fm:', cleanArtist);
                    
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data.artist && data.artist.image) {
                        const images = data.artist.image;
                        const largeImage = images.find(img => img.size === 'extralarge') || 
                                          images.find(img => img.size === 'large') || 
                                          images.find(img => img.size === 'medium');
                        
                        if (largeImage && largeImage['#text'] && largeImage['#text'].length > 10) {
                            console.log('✅ Imagen de artista encontrada:', largeImage['#text']);
                            this.updateAlbumArt(largeImage['#text']);
                            return;
                        }
                    }
                    
                    console.log('❌ No se encontró imagen de artista');
                    this.showDefaultLogo();
                    
                } catch (error) {
                    console.error('❌ Error buscando artista:', error);
                    this.showDefaultLogo();
                }
            }

            updateAlbumArt(imageUrl) {
                console.log('🖼️ Intentando cargar imagen:', imageUrl);
                
                // Verificar que la URL sea válida
                if (!imageUrl || typeof imageUrl !== 'string' || imageUrl.length < 10) {
                    console.log('❌ URL de imagen inválida');
                    this.showDefaultLogo();
                    return;
                }
                
                // Crear una nueva imagen para probar la carga
                const testImg = new Image();
                testImg.crossOrigin = 'anonymous'; // Para evitar problemas de CORS
                
                testImg.onload = () => {
                    console.log('✅ Imagen cargada exitosamente, aplicando...');
                    this.albumArt.src = imageUrl;
                    this.albumArt.classList.add('show');
                    this.logoContent.style.opacity = '0';
                    this.isShowingSongArt = true; // Marcar que estamos mostrando artwork de canción
                };
                
                testImg.onerror = () => {
                    console.log('❌ Error al cargar imagen desde URL:', imageUrl);
                    this.showDefaultLogo();
                };
                
                // Timeout para evitar esperas indefinidas
                setTimeout(() => {
                    if (!testImg.complete) {
                        console.log('⏰ Timeout al cargar imagen');
                        this.showDefaultLogo();
                    }
                }, 10000);
                
                // Iniciar la carga de prueba
                testImg.src = imageUrl;
            }

            showDefaultLogo() {
                console.log('🔄 Volviendo a portadas por defecto');
                this.isShowingSongArt = false;
                this.showCurrentDefaultCover();
            }

            play() {
                this.audioPlayer.src = this.streamUrl + '?t=' + Date.now(); // Cache busting
                this.audioPlayer.load();
                
                const playPromise = this.audioPlayer.play();
                
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            this.isPlaying = true;
                            this.playButton.classList.add('pause');
                            this.setLiveIndicator(true); // Activar indicador EN VIVO (rojo)
                            this.updateStatus('connected', '🟢 Reproduciendo');
                        })
                        .catch((error) => {
                            console.error('Error al reproducir:', error);
                            this.handleConnectionError();
                        });
                }
            }

            pause() {
                this.audioPlayer.pause();
                this.isPlaying = false;
                this.playButton.classList.remove('pause');
                this.setLiveIndicator(false); // Desactivar indicador EN VIVO (verde)
                this.updateStatus('connected', '⏸️ Pausado');
            }

            setVolume(value) {
                const volume = value / 100;
                this.audioPlayer.volume = volume;
                this.volumeSlider.value = value;
                this.volumeDisplay.textContent = value + '%';
                
                // Actualizar la barra visual
                this.volumeFill.style.width = value + '%';
                
                // Actualizar icono de volumen
                if (volume === 0) {
                    this.volumeBtn.innerHTML = '🔇';
                } else if (volume < 0.5) {
                    this.volumeBtn.innerHTML = '🔉';
                } else {
                    this.volumeBtn.innerHTML = '🔊';
                }
            }

            toggleMute() {
                if (this.isMuted) {
                    this.setVolume(this.previousVolume * 100);
                    this.isMuted = false;
                } else {
                    this.previousVolume = this.audioPlayer.volume;
                    this.setVolume(0);
                    this.isMuted = true;
                }
            }

            handleConnectionError() {
                this.updateStatus('error', '🔴 Error de conexión');
                this.setLiveIndicator(false); // Poner EN VIVO en verde cuando hay error
                
                if (this.isPlaying && this.reconnectAttempts < this.maxReconnectAttempts) {
                    this.reconnectAttempts++;
                    this.updateStatus('reconnecting', `🟡 Reconectando (${this.reconnectAttempts}/${this.maxReconnectAttempts})...`);
                    
                    setTimeout(() => {
                        this.reconnect();
                    }, this.reconnectDelay);
                }
            }

            reconnect() {
                if (this.isPlaying) {
                    this.play();
                }
            }

            updateStatus(className, text) {
                this.status.className = className;
                this.status.textContent = text;
            }

            // Métodos para controlar el indicador EN VIVO
            setLiveIndicator(isLive) {
                if (isLive) {
                    this.liveIndicator.classList.remove('offline');
                    this.liveIndicator.classList.add('live');
                } else {
                    this.liveIndicator.classList.remove('live');
                    this.liveIndicator.classList.add('offline');
                }
            }

            destroy() {
                if (this.eventSource) {
                    this.eventSource.close();
                }
                if (this.networkStabilizer) {
                    clearInterval(this.networkStabilizer);
                }
                if (this.coverRotationTimer) {
                    clearInterval(this.coverRotationTimer);
                }
                this.audioPlayer.pause();
                this.audioPlayer.src = '';
            }
        }

        // Función para mostrar mensaje flotante
        function showDownloadMessage() {
            const message = document.getElementById('downloadMessage');
            if (message) {
                message.classList.remove('hide');
                message.classList.add('show');
            }
        }

        // Función para ocultar mensaje flotante
        function hideDownloadMessage() {
            const message = document.getElementById('downloadMessage');
            if (message) {
                message.classList.remove('show');
                message.classList.add('hide');
            }
        }

        // Función para manejar el ciclo de mostrar/ocultar mensaje
        function startDownloadMessageCycle() {
            // Mostrar mensaje después de 3 segundos
            setTimeout(() => {
                showDownloadMessage();
            }, 3000);

            // Ocultar mensaje después de 20 segundos de mostrar (3000 + 20000 = 23000ms)
            setTimeout(() => {
                hideDownloadMessage();
            }, 23000);

            // Repetir cada 60 segundos
            setInterval(() => {
                setTimeout(() => {
                    showDownloadMessage();
                }, 2000); // Mostrar después de 2 segundos

                setTimeout(() => {
                    hideDownloadMessage();
                }, 22000); // Ocultar después de 20 segundos más (2000 + 20000 = 22000ms)
            }, 60000);
        }

        document.addEventListener('DOMContentLoaded', function() {

            const facebookBtn = document.getElementById('facebookBtn');
            if (facebookBtn) {
                facebookBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    openFacebook();
                });
            }

            const downloadBtn = document.getElementById('downloadFloat');
            if (downloadBtn) {
                downloadBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    openDownload();
                });
            }

            // Inicializar mensaje flotante
            const message = document.getElementById('downloadMessage');
            const messageClose = document.getElementById('messageClose');
            
            if (message && messageClose) {
                // Cerrar mensaje manualmente
                messageClose.addEventListener('click', function() {
                    hideDownloadMessage();
                });

                // Iniciar ciclo de mensaje
                startDownloadMessageCycle();
            }

            // Inicializar botón de compartir
            const shareBtn = document.getElementById('shareBtn');
            const shareMenu = document.getElementById('shareMenu');
            
            if (shareBtn && shareMenu) {
                shareBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    shareMenu.classList.toggle('show');
                });

                // Cerrar menú al hacer clic fuera
                document.addEventListener('click', function() {
                    shareMenu.classList.remove('show');
                });

                // Manejar clicks en las opciones del menú
                const shareItems = shareMenu.querySelectorAll('.share-menu-item');
                shareItems.forEach(item => {
                    item.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const platform = this.getAttribute('data-platform');
                        const shareUrl = 'https://radioemisioncristiana.blogspot.com/';
                        const shareText = '¡Escucha Radio Emisión Cristiana en línea! 🎵';
                        
                        let url = '';
                        
                        switch(platform) {
                            case 'whatsapp':
                                url = `whatsapp://send?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`;
                                // Fallback para navegadores que no soporten whatsapp://
                                if (!navigator.userAgent.match(/(iPhone|iPad|iPod|Android)/i)) {
                                    url = `https://web.whatsapp.com/send?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`;
                                }
                                window.open(url, '_blank');
                                break;
                                
                            case 'facebook':
                                url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`;
                                window.open(url, '_blank', 'width=600,height=400');
                                break;
                                
                            case 'twitter':
                                url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
                                window.open(url, '_blank', 'width=600,height=400');
                                break;
                                
                            case 'instagram':
                                // Instagram no tiene API directa de compartir, copiamos al portapapeles
                                const instagramText = `${shareText}\n\n🔗 ${shareUrl}`;
                                navigator.clipboard.writeText(instagramText).then(() => {
                                    // Mostrar notificación
                                    const notification = document.createElement('div');
                                    notification.textContent = '¡Texto copiado! Ahora ábre Instagram y pégalo en tu historia o publicación';
                                    notification.style.cssText = `
                                        position: fixed;
                                        top: 20px;
                                        right: 20px;
                                        background: #E4405F;
                                        color: white;
                                        padding: 15px 20px;
                                        border-radius: 8px;
                                        z-index: 10000;
                                        font-size: 14px;
                                        max-width: 300px;
                                        box-shadow: 0 4px 12px rgba(228, 64, 95, 0.3);
                                    `;
                                    document.body.appendChild(notification);
                                    setTimeout(() => {
                                        document.body.removeChild(notification);
                                    }, 5000);
                                });
                                break;
                        }
                        
                        // Cerrar menú después de hacer clic
                        shareMenu.classList.remove('show');
                    });
                });
            }
        });
